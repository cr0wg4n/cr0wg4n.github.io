[package]
name = "comments-api"
version = "0.1.0"
edition = "2021"
description = "Comments and reactions API for cr0wg4n.com (AWS Lambda + DynamoDB + SNS)"
license = "GPL-3.0-only"
publish = false

# Lambda custom runtimes must be called "bootstrap".
[[bin]]
name = "bootstrap"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
aws-config = "1.13.1"
aws-sdk-dynamodb = "1.138.0"
aws-sdk-sns = "1.122.0"
aws-sdk-ssm = "1.135.0"
hex = "0.4.3"
hmac = "0.13.0"
lambda_http = "1.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros"] }
uuid = { version = "1.29.2", features = ["v4"] }
