<?xml version="1.0" encoding="UTF-8"?>
<!--
  Article card template (1200x600, the 2:1 ratio of the site's card thumbnails).
  Same look as the generated cards in assets/img/posts/: dark background, orange glow and thinning rings on
  the right, title on the left, source in orange underneath.

  To make a new card by hand: edit the <tspan> lines (one per line of the title, 84px apart) and the source
  text, then export to PNG (Inkscape, Figma, or `magick -density 96 card-template.svg out.png`). Install the
  Rubik font first (https://fonts.google.com/specimen/Rubik) or the text falls back to a system font.
  To make one from the command line instead, use docs/make-card.py (same design, no SVG editor needed).

  Colours: background #1c1917, orange #f97316 (the "fire" scheme's primary), title #ffffff.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <!-- orange glow centred on the rings: 30% at the centre, fading to nothing -->
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="1010" cy="300" r="500">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="#1c1917"/>
  <rect width="1200" height="600" fill="url(#glow)"/>

  <!-- rings: radius 90 to 330, each thinner and more transparent than the last -->
  <g fill="none" stroke="#f97316" stroke-linecap="round">
    <circle cx="1010" cy="300" r="90"  stroke-width="7"   stroke-opacity="0.80"/>
    <circle cx="1010" cy="300" r="150" stroke-width="5.6" stroke-opacity="0.65"/>
    <circle cx="1010" cy="300" r="210" stroke-width="4.2" stroke-opacity="0.50"/>
    <circle cx="1010" cy="300" r="270" stroke-width="2.8" stroke-opacity="0.35"/>
    <circle cx="1010" cy="300" r="330" stroke-width="1.4" stroke-opacity="0.20"/>
  </g>

  <!-- title: Rubik Bold 68px, max ~700px wide. Keep 1-3 lines; centre the block around y = 280. -->
  <g font-family="Rubik, 'Noto Sans', Arial, sans-serif" font-weight="700" font-size="68" fill="#ffffff">
    <text x="80" y="238"> <!-- first line baseline: 280 - (lines - 1) * 42 -->
      <tspan x="80" dy="0">TITLE LINE 1</tspan>
      <tspan x="80" dy="84">TITLE LINE 2</tspan>
    </text>
  </g>

  <!-- source -->
  <text x="80" y="505" font-family="Rubik, 'Noto Sans', Arial, sans-serif" font-weight="500" font-size="34"
        fill="#f97316">example.com</text>
</svg>
